<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#174d2a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<title>T Green Naturals</title>
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="assets/logo.png">
<link rel="stylesheet" href="style.css">
</head>
<body>
<header>
  <div class="brand">
    <img src="logo.png" alt="T Green Naturals">
    <div><b>T GREEN NATURALS</b><small>Pure • Natural • Healthy</small></div>
  </div>
  <button class="cart" onclick="showCart()">🛒 <span id="cartCount">0</span></button>
</header>

<main>
  <section class="hero">
    <h1>Goodness From Nature To Your Home</h1>
    <p>Pure & traditional products, delivered with care.</p>
    <button onclick="document.getElementById('products').scrollIntoView({behavior:'smooth'})">Shop Now</button>
  </section>

  <section>
    <h2 id="products">Our Products</h2>
    <div id="productGrid" class="grid"></div>
  </section>
</main>

<nav class="bottom">
  <button onclick="window.scrollTo({top:0,behavior:'smooth'})">🏠<span>Home</span></button>
  <button onclick="document.getElementById('products').scrollIntoView({behavior:'smooth'})">🛍️<span>Products</span></button>
  <button onclick="showCart()">🛒<span>Cart</span></button>
  <button onclick="orderAll()">📲<span>WhatsApp</span></button>
</nav>

<div id="cartModal" class="modal hidden">
  <div class="sheet">
    <button class="close" onclick="closeCart()">✕</button>
    <h2>Your Cart</h2>
    <div id="cartItems"></div>
    <div class="total" id="cartTotal"></div>
    <button class="primary" onclick="orderAll()">Order on WhatsApp</button>
  </div>
</div>

<script>
const WHATSAPP="917207876364";
const products=[
 {id:1,name:"Cold Pressed Groundnut Oil",price:350,unit:"1 L",image:"groundnut-oil.jpg"},
{id:2,name:"Cold Pressed Coconut Oil",price:450,unit:"1 L",image:"coconut-oil.jpg"},
{id:3,name:"Multifloral Honey",price:595,unit:"",image:"multifloral-honey.jpg"},
{id:4,name:"Pooja Oil",price:248,unit:"1 L",image:"pooja-oil.jpg"},
{id:5,name:"Cold Pressed Sesame Oil",price:515,unit:"1 L",image:"sesame-oil.jpg"},
{id:6,name:"Pink Salt",price:88,unit:"1 kg",image:"pink-salt.jpg"}
];
let cart=JSON.parse(localStorage.getItem("tg_cart")||"{}");

function save(){localStorage.setItem("tg_cart",JSON.stringify(cart)); updateCount();}
function updateCount(){document.getElementById("cartCount").textContent=Object.values(cart).reduce((a,b)=>a+b,0);}
function add(id){cart[id]=(cart[id]||0)+1;save();toast("Added to cart");}
function change(id,d){cart[id]=(cart[id]||0)+d;if(cart[id]<=0)delete cart[id];save();renderCart();}
function render(){
 document.getElementById("productGrid").innerHTML=products.map(p=>`
 <article class="card">
   <div class="photo"><img src="${p.image}" alt="${p.name}"></div>
   <h3>${p.name}</h3><div class="price">₹${p.price} ${p.unit?"/ "+p.unit:""}</div>
   <button onclick="add(${p.id})">Add to Cart</button>
 </article>`).join("");
 updateCount();
}
function renderCart(){
 const entries=Object.entries(cart).filter(([_,q])=>q>0);
 const box=document.getElementById("cartItems");
 if(!entries.length){box.innerHTML="<p>Your cart is empty.</p>";document.getElementById("cartTotal").textContent="";return;}
 let total=0;
 box.innerHTML=entries.map(([id,q])=>{
  const p=products.find(x=>x.id==id); total+=p.price*q;
  return `<div class="row"><div><b>${p.name}</b><small>₹${p.price} × ${q}</small></div>
  <div><button onclick="change(${p.id},-1)">−</button><b>${q}</b><button onclick="change(${p.id},1)">+</button></div></div>`;
 }).join("");
 document.getElementById("cartTotal").textContent="Total: ₹"+total;
}
function showCart(){document.getElementById("cartModal").classList.remove("hidden");renderCart();}
function closeCart(){document.getElementById("cartModal").classList.add("hidden");}
function orderAll(){
 const entries=Object.entries(cart).filter(([_,q])=>q>0);
 if(!entries.length){toast("Add a product first");return;}
 let msg="Hello T Green Naturals!%0A%0AI would like to order:%0A";
 let total=0;
 entries.forEach(([id,q])=>{const p=products.find(x=>x.id==id);total+=p.price*q;msg+=`• ${p.name} × ${q} = ₹${p.price*q}%0A`;});
 msg+=`%0AEstimated total: ₹${total}%0A%0AName:%0ADelivery Address:`;
 window.open("https://wa.me/"+WHATSAPP+"?text="+msg,"_blank");
}
function toast(t){const x=document.createElement("div");x.className="toast";x.textContent=t;document.body.appendChild(x);setTimeout(()=>x.remove(),1500);}
render();
</script>
</body>
</html>
